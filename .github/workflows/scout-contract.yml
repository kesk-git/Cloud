name: scout-contract
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: scout-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  golden-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - name: Compare default smoke output with documented golden contract
        shell: bash
        run: |
          go run . --smoke > actual-smoke.txt
          diff -u .fleet/fixtures/smoke.txt actual-smoke.txt
